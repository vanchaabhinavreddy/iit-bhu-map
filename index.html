<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IIT (BHU) Campus Satellite Map</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070c;
    }

    #map {
      width: 100vw;
      height: 100vh;
    }

    /* Perimeter Pins */
    .custom-pin {
      width: 12px;
      height: 12px;
      background: #f59e0b;
      border: 2px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.8);
      animation: pulse 2s infinite;
    }

    /* Circular/Oval Marker Pins Beside Names */
    .named-pin {
      width: 20px;
      height: 20px;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 16px rgba(255, 255, 255, 0.9);
      animation: pulse 2s infinite;
    }

    .named-pin.gate { background: #ef4444; }
    .named-pin.sac { background: #3b82f6; }
    .named-pin.rajputana { background: #10b981; }
    .named-pin.gymkhana { background: #8b5cf6; }
    .named-pin.adv { background: #06b6d4; }
    .named-pin.lt3 { background: #f43f5e; }
    .named-pin.lt1 { background: #eab308; }
    .named-pin.lt2 { background: #f97316; }
    .named-pin.cse { background: #0284c7; }
    .named-pin.mnc { background: #10b981; }
    .named-pin.elec { background: #a855f7; }
    .named-pin.ece { background: #ec4899; }
    .named-pin.vt { background: #f59e0b; }
    .named-pin.swatantrata { background: #14b8a6; }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7); }
      70% { box-shadow: 0 0 0 12px rgba(255, 255, 255, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
    }

    /* High-Contrast Rounded Rectangular Label Badges */
    .map-badge-label {
      background: #000000 !important; /* Solid dark background */
      border: 2px solid #ffffff !important;
      color: #ffffff !important;
      font-size: 14px !important;
      font-weight: 900 !important;
      letter-spacing: 0.5px !important;
      padding: 6px 12px !important;
      border-radius: 8px !important; /* Smoothly bent rounded corners */
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.95), 0 0 10px rgba(0,0,0,0.8) !important;
      white-space: nowrap !important;
      text-transform: uppercase !important;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9) !important;
    }

    /* Color Accent Borders & Text per Badge */
    .map-badge-label.gate { border-color: #ef4444 !important; color: #ff8080 !important; }
    .map-badge-label.sac { border-color: #3b82f6 !important; color: #93c5fd !important; }
    .map-badge-label.rajputana { border-color: #10b981 !important; color: #6ee7b7 !important; }
    .map-badge-label.gymkhana { border-color: #8b5cf6 !important; color: #c4b5fd !important; }
    .map-badge-label.adv { border-color: #06b6d4 !important; color: #67e8f9 !important; }
    .map-badge-label.lt3 { border-color: #f43f5e !important; color: #fda4af !important; }
    .map-badge-label.lt1 { border-color: #eab308 !important; color: #fef08a !important; }
    .map-badge-label.lt2 { border-color: #f97316 !important; color: #fed7aa !important; }
    .map-badge-label.cse { border-color: #0284c7 !important; color: #38bdf8 !important; }
    .map-badge-label.mnc { border-color: #10b981 !important; color: #6ee7b7 !important; }
    .map-badge-label.elec { border-color: #a855f7 !important; color: #e9d5ff !important; }
    .map-badge-label.ece { border-color: #ec4899 !important; color: #fbcfe8 !important; }
    .map-badge-label.vt { border-color: #f59e0b !important; color: #fde68a !important; }
    .map-badge-label.swatantrata { border-color: #14b8a6 !important; color: #99f6e4 !important; }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // 16 Campus Perimeter Coordinates
    const campusPerimeter = [
      [25.266265, 82.982313],
      [25.267858, 82.990623],
      [25.266579, 82.993425],
      [25.263474, 82.992773],
      [25.263722, 82.996193],
      [25.262491, 82.996504],
      [25.261647, 82.996983],
      [25.259000, 82.995136],
      [25.256886, 82.993208],
      [25.258225, 82.991835],
      [25.256401, 82.989271],
      [25.258516, 82.987887],
      [25.257187, 82.984904],
      [25.259890, 82.983775],
      [25.259502, 82.981758],
      [25.262938, 82.981827]
    ];

    // Boundaries
    const rajputanaCoords = [
      [25.262969, 82.987175], [25.261928, 82.987289], [25.261856, 82.986951],
      [25.260893, 82.987163], [25.261288, 82.988819], [25.263077, 82.988292]
    ];

    const gymkhanaCoords = [
      [25.260698, 82.987321], [25.258804, 82.988065],
      [25.259902, 82.990538], [25.261315, 82.989901]
    ];

    const advCoords = [
      [25.258536, 82.988042], [25.256491, 82.989443],
      [25.258208, 82.991754], [25.259663, 82.990677]
    ];

    const lt3Coords = [
      [25.258816, 82.992266],
      [25.259112, 82.992694],
      [25.258861, 82.992947],
      [25.258559, 82.992491]
    ];

    const lt1Coords = [
      [25.260316, 82.990732], [25.260415, 82.991194],
      [25.260262, 82.991240], [25.260105, 82.990787]
    ];

    const lt2Coords = [
      [25.262088, 82.993660], [25.262164, 82.993958],
      [25.261877, 82.994074], [25.261770067903935, 82.99376178151375]
    ];

    const cseCoords = [
      [25.262597, 82.993213], [25.262631049743423, 82.9933908279121],
      [25.262123343976103, 82.99360704123647], [25.26204787401865, 82.99337755165533]
    ];

    const mncCoords = [
      [25.261986125836735, 82.9934154838175], [25.262032436976103, 82.99358428193916],
      [25.261701397699166, 82.99371704450836], [25.261646510271273, 82.99354824638668]
    ];

    const elecCoords = [
      [25.26149852459652, 82.9925702183574], [25.26189372364088, 82.9924553890883],
      [25.261801414490193, 82.9921268497906], [25.26138469590321, 82.99223637758664]
    ];

    const eceCoords = [
      [25.263078345850353, 82.98998959940263], [25.263223167492082, 82.99074066753506],
      [25.262807059774925, 82.9909008051849], [25.262625522137796, 82.99012041607433]
    ];

    const sacCoords = [
      [25.26292177616015, 82.98675472316458], [25.262958491569638, 82.98707725392414],
      [25.26197737042278, 82.98725092433315], [25.261930455907354, 82.9868855398363]
    ];

    const swatantrataCoords = [
      [25.26101269051884, 82.99424054103146],
      [25.261005413365407, 82.99451949075807],
      [25.260888978851128, 82.99494596197472],
      [25.260428091136497, 82.99481185152924],
      [25.260588189172516, 82.99414398151072]
    ];

    // Initialize Leaflet Map
    const map = L.map('map', { zoomControl: true });

    // Satellite Tile Layer
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Esri Satellite'
    }).addTo(map);

    // Dark Overlay Mask Outside Perimeter
    const outerBounds = [
      [90, -180], [90, 180], [-90, 180], [-90, -180]
    ];

    L.polygon([outerBounds, campusPerimeter], {
      color: 'transparent',
      fillColor: '#05070c',
      fillOpacity: 0.95,
      interactive: false
    }).addTo(map);

    // Glowing Campus Perimeter Boundary Line
    const campusPoly = L.polygon(campusPerimeter, {
      color: '#f59e0b',
      weight: 3,
      fillColor: '#f59e0b',
      fillOpacity: 0.05,
      dashArray: '6, 6'
    }).addTo(map);

    map.fitBounds(campusPoly.getBounds(), { padding: [30, 30] });

    // Perimeter Pins
    campusPerimeter.forEach(coord => {
      const pinIcon = L.divIcon({
        className: 'custom-pin',
        iconSize: [12, 12],
        iconAnchor: [6, 6]
      });
      L.marker(coord, { icon: pinIcon }).addTo(map);
    });

    // Helper function to add polygon region with pin + rounded rectangle badge
    function addRegion(coords, color, className, labelText, centerOverride) {
      const poly = L.polygon(coords, {
        color: color,
        weight: 3,
        fillColor: color,
        fillOpacity: 0.4
      }).addTo(map);

      const center = centerOverride || poly.getBounds().getCenter();
      
      // Pin dot marker
      L.marker(center, {
        icon: L.divIcon({
          className: `named-pin ${className}`,
          iconSize: [20, 20],
          iconAnchor: [10, 10]
        })
      }).addTo(map);

      // Label badge
      L.marker(center, {
        icon: L.divIcon({
          className: `map-badge-label ${className}`,
          html: labelText,
          iconAnchor: [-14, 12]
        })
      }).addTo(map);
    }

    // Helper function for standalone points (e.g. VT, Gate)
    function addPoint(coord, className, labelText) {
      L.marker(coord, {
        icon: L.divIcon({
          className: `named-pin ${className}`,
          iconSize: [20, 20],
          iconAnchor: [10, 10]
        })
      }).addTo(map);

      L.marker(coord, {
        icon: L.divIcon({
          className: `map-badge-label ${className}`,
          html: labelText,
          iconAnchor: [-14, 12]
        })
      }).addTo(map);
    }

    // Add Regions & Labels
    addRegion(rajputanaCoords, '#10b981', 'rajputana', 'RAJPUTANA GROUND');
    addRegion(gymkhanaCoords, '#8b5cf6', 'gymkhana', 'GYMKHANA GROUND');
    addRegion(advCoords, '#06b6d4', 'adv', 'ADV GROUND');
    addRegion(lt3Coords, '#f43f5e', 'lt3', 'LT-3');
    addRegion(lt1Coords, '#eab308', 'lt1', 'LT-1');
    addRegion(lt2Coords, '#f97316', 'lt2', 'LT-2');
    addRegion(cseCoords, '#0284c7', 'cse', 'CSE DEPT');
    addRegion(mncCoords, '#10b981', 'mnc', 'MNC DEPT');
    addRegion(elecCoords, '#a855f7', 'elec', 'ELECTRICAL DEPT');
    addRegion(eceCoords, '#ec4899', 'ece', 'ELECTRONICS DEPT');
    addRegion(sacCoords, '#3b82f6', 'sac', 'SAC (STUDENT ACTIVITY CENTRE)');
    addRegion(swatantrataCoords, '#14b8a6', 'swatantrata', 'SWATANTRATA BHAWAN');

    // Add Point Locations
    addPoint([25.265914421933257, 82.98792017855357], 'vt', 'VISHWANATH TEMPLE');
    addPoint([25.262958, 82.981820], 'gate', 'HYDERABAD GATE');
  </script>
</body>
</html>
